<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>getit options</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px system-ui, sans-serif;
      }
      body {
        margin: 16px;
        min-width: 320px;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      p {
        margin: 4px 0 0 24px;
        opacity: 0.7;
      }
      #status {
        margin: 16px 0 0;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="takeOver" />
      <span>Send browser downloads to getit</span>
    </label>
    <p>
      New downloads are captured by getit instead, for you to add to a folder there. If getit isn't running it's started first; if it can't start, the browser downloads as usual.
      Files behind a login may fail in getit, since it doesn't share the browser's cookies.
    </p>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
