[package]
name = "getit"
version = "0.8.4"
description = "getit download manager"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "getit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getit-engine = { path = "../engine" }
tokio = { version = "1", features = ["sync"] }
tauri-plugin-clipboard-manager = "2"
tiny_http = "0.12"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSFileManager", "NSGeometry", "NSProcessInfo", "NSString", "NSURL"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5"
# Opening a `getit://` link starts a second process on Windows and Linux; this
# hands it to the running app instead.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
