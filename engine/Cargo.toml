[package]
name = "getit-engine"
version = "0.1.0"
description = "HTTP download engine for getit: self-saving per-folder queues with pause/resume"
edition = "2024"

[dependencies]
futures-util = "0.3"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8"
sha2 = "0.10"
tempfile = "3"
